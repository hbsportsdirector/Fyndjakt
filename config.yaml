  # Omskriven 2026-10-23 – Sherlock Holmes-inspirerat engelskt bibliotek i Åkersberga.
  # Chesterfield + wingback + klubbfåtölj finns redan. Jaga mahogny-möbler, mässing och antikvariska detaljer.
  hemmet:
