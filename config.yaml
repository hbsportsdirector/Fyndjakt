  # ── 2. Konst, glas och design ────────────────────────────────
  samlingen:
    namn: Samlingen
    prioritet: 1          # söks först: föremål som båda spåren hittar hamnar här
    profilfil: samlingsprofil.md
    tillagg: |
      Bedöm ENBART efter profilen ovan (ny från 14 oktober 2026). Det kunden inte nämner där är inte intressant.
      Ulrica Hydman-Vallien och Bertil Vallien: högst 2, oavsett föremål.
      Konst: bara de fem namngivna konstnärerna – övrig konst, grafik och posters högst 3.
      Ulf Lundell: bara konst/grafik – skivor, böcker och memorabilia högst 2.
      Kosta Boda Line / Anna Ehrner: BARA champagne- och martiniglas kan få 8+ (till setet). Vinglas, karaffer,
      snapsglas, whiskyglas, skålar och övrigt ur Line högst 6. Kunden har redan många – var sparsam även med
      champagne/martini: 8 bara för bra pris eller fler glas i samma annons.
      Följ prisnivåerna i profilen och räkna ner för sådant som redan finns i samlingen.
      PLATS: Kunden bor i Stockholm och vill helst hämta själv. Föremål i Stockholmsområdet: +1 (högst 10).
      Stora eller ömtåliga föremål (möbler, stora fat, glas i set) långt från Stockholm utan frakt: −2.
      Små saker som enkelt skickas: ingen skillnad.
    uteslut_ord: [affischtryck, offsettryck, print on canvas, vinylskiva, lp-skiva, cd-skiva]
    # Synkade lärdomar 14 okt 2026: ny smak + det som stämmer från tidigare reaktioner.
    lardomar_bas: |
      - Rörstrand Blå Eld och Röd Eld (Hertha Bengtson) i alla former – även kannor, tekannor och servisdelar. Röd Eld är ovanligare och ska ha högst.
      - Koka, Ceylon, Rosmarin och grå/vit Blå Eld är inte intressant. Nyproduktion (efter jubileet) ger lågt.
      - Erik Höglund/Boda: röda föremål först, i tung bubblig glasform. Bärnsten och koboltblått är okej men lägre.
      - Stig Lindberg gillas när formen bär (relief, textur, inpressat mönster som Reptil) – inte målad eller tryckt dekor (Prunus, Comedia, Fallande löv) och inte fiskfat.
      - Orrefors i dämpade mörka toner med tjockt underfång (Nils Landberg, Sven Palmqvist Kraka) och Vicke Lindstrands färgade Kosta-glas gillas.
      - Rörstrand Picknick gillas i alla delar; lågt pris (ca 280–650 kr) är ett plus.
      - Pierre Forssell/Skultuna Prins gillas; Festivitas och Gense-ströare gjorde det inte.
      - Ulrica Hydman-Vallien, Bertil Vallien, Ingeborg Lundin, Gunnel Sahlin, Kjell Engman och Bernadotte & Kylberg: nej.
      - Krackelering, nagg och nyproduktion drar ner tydligt.
    # Egna betygsregler för samlingen.
    bedomningsregler: |
      Kunden SAMLAR utvalda svenska och engelska serier och formgivare (se profilen). Serietillverkade föremål
      ur de namngivna serierna är PRECIS vad hen söker – dra inte ner för att något är bruksföremål eller vanligt.
      Var sparsam med 9 och 10 så att det verkligt intressanta syns:
      - 10: Ovanlig variant eller något som uttryckligen saknas (Röd Eld, röd Höglund, Wingård-karaff,
            Janssons frestelse-nummer som saknas) – eller ett tydligt fynd långt under marknadspris.
      - 9: Eftersökt serie/formgivare ur profilen i gott skick till bra pris, med en form som inte är vardaglig
           (kanna, terrin, vas, större fat).
      - 8: Rätt serie eller formgivare ur profilen, vanlig form (assiett, tefat, enstaka kopp) i gott skick.
      - 6–7: Rätt fabrik men fel serie, anonym form, osäker stämpel eller dåligt skick.
      - 4–5: Osäker tillverkare, nyproduktion, eller utanför profilen men i närheten.
      - 0–3: Fel kategori, något kunden sagt nej till, reproduktion, eller exakt det kunden redan har.
      Ett lågt pris är ett plus, inte ett tecken på låg kvalitet.
    max_pris: 40000
