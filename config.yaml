# ──────────────────────────────────────────────────────────────
#  Fyndjakt – inställningar
#  Ändra fritt. Allt som står här läses in vid varje körning.
# ──────────────────────────────────────────────────────────────

# Din stil läses från den här filen. Byt ut eller redigera den när du vill.
stilfil: stil.md

# Extra instruktioner till AI:n utöver stilfilen.
tillagg: |
  Jag letar begagnade/vintage-föremål till det här hemmet. Fokusera på lösa föremål –
  inte golv, färg eller lister.
  Mest av allt söker jag: stora bokhyllor och bokskåp i mörkt trä, gamla kartor och
  sjökort, jordglober och vetenskaplig kuriosa (teleskop, kompasser, instrument),
  konst för väggarna (oljemålningar, porträtt, grafik) och udda detaljer med historia
  (byster, mässingsobjekt, skrivbordsföremål, naturalier).
  Mässing, mörk valnöt, mahogny, cognacfärgat läder, mörkgrön sammet, burgundy/oxblod och
  vit/grå marmor med mässing är rätt. Patina och ålder är ett plus.
  Fel: krom, blanka lackytor, kalla grå toner, ljus/vitpigmenterad ek, ljus skandinavisk minimalism.

# Saker jag redan har. Annonser som uppenbart är någon av dessa sorteras bort direkt,
# och AI:n ger låga betyg åt liknande föremål.
har_redan:
  - Chesterfield-soffa
  - bordslampor och bankirlampa
  - klubbfåtölj i läder
  - wingback-fåtölj
har_redan_ord:
  - chesterfield
  - bordslampa
  - bordlampe
  - bordlampa
  - bankirlampa
  - bankerlampa
  - klubbfåtölj
  - wingback
  - öronlappsfåtölj
  - öronlappsstol

# Bara annonser i Sverige (svenska auktionshus på Auctionet; Tradera är alltid svenskt).
bara_sverige: true

# Betyg som krävs för Telegram-notis, och standardfiltret på sidan (0–10).
min_betyg: 8

# Lägsta betyg som syns på hemsidan över huvud taget.
sajt_min_betyg: 8

# Max antal fynd av samma typ (samma sökord) på sidan – ger variation.
sajt_max_per_sokord: 3

# Prisgräns i kronor (utrop/aktuellt pris/köp nu). 0 = ingen gräns.
max_pris: 25000

# Max antal NYA annonser som AI-bedöms per körning (styr kostnaden).
max_bedomningar_per_korning: 150

# AI-modell för bedömningen. Haiku är billig och klarar bilder bra.
# Byt till claude-sonnet-5-5 om du vill ha skarpare omdömen.
modell: claude-haiku-4-5-20251001

# Ord som gör att en annons sorteras bort direkt, utan AI (sparar pengar).
uteslut_ord:
  - ikea
  - plast
  - högglans
  - krom
  - vitpigmenterad
  - reservdel
  - defekt
  - reproduktion
  - affisch
  - poster

