    # Omskrivna lärdomar 23 okt 2026 – ny smak.
    lardomar_bas: |
      - Röd Eld / Blå Eld röd variant: ALL form är värd 8+. Saknade former (tekanna, kaffekanna, soppskålar, sockerkar, karott): 9-10. Har redan 24 okt: skål/kopp konformad + peppar/saltströare äggform - ge 0-3 åt exakt samma form.
      - Blå Eld blå: enkla tallrikar och muggar har kunden redan - max 4. Ovanliga former (karaffer, lock-skålar, tekannor, salt/peppar, större serveringsfat): 8+. Har redan 24 okt: tekanna/kaffekanna bulbous med hög pip + D-handtag - ge 0-3 åt exakt samma form.
      - Domino (Stig Lindberg Gustavsberg 1954-79): ovanliga former 9, standard-former 8. Gunnar Nylund Domino för Rörstrand OK men lägre.
      - Domino REKLAM-ASKFAT (Volkswagen, Scania Vabis, LUMA, Electrolux) = 10 oavsett skick upp till 25000 kr. Högsta prestige i serien.
      - Domino H55-set: cigarette-holder + askfat med präglat "H H H H" + "55" i hörnet. 1stdibs listpris €2362 (~27000 kr sålt). Svensk fynd-tröskel: under 10000 kr = fynd. Ge 10 upp till 25000 kr.
      - Domino H55-butik: BARA "H" utan "55" (sold efter mässan) = 9.
      - Domino LIGHT BLUE / ljusblå variant = 10 oavsett form (mycket sällsynt).
      - Domino vas HÖGRE än 23 cm = 10 (ryktad liten upplaga).
      - Domino LABYRINT-mönster askfat 15x15 = 9 (ovanlig).
      - Domino STRIPES-mönster askfat 15x15 eller 20x20 = 8-9.
      - Domino CHECKER-askfat 15x15 och 20x20 i svart/vit = kunden HAR BÅDA (sedan 24 okt 2026). Ge 0-3 åt exakt samma.
      - Erik Höglund Boda: röd = 9 (ovanlig). Opalin orange/turkos/grön/lila = 8.
      - Sommerso Nils Landberg karaffer och vaser = 8-9. Illusion/tulpanglas = max 4.
      - Vicke Lindstrand för Kosta: tjockt underfång med bubblor och ränder = 8. LH-signerade (Lindstrand Hytt) = 9. Kunden har 1 stor rund skål med turkos kärna + bubblor (sedan 24 okt 2026) - ge 0-3 åt exakt samma. Höga vaser LH, karaffer LH, ovanliga färger (grön/röd/lila) = 9-10.
      - Kosta Boda Line (Anna Ehrner): BARA champagne- och martiniglas kan få 8+. Stora satser = max 5.
      - Deco Hälsingborg: BURKAR MED LOCK 8+. Vaser/krus/kannor/fat = max 5.
      - Jie / Anita Nylund: burkar/kryddställ 8. Dyra "Vår lilla stad" = max 4.
      - Rörstrand Picknick: BURKAR 8. Karotter/skålar/fat = max 4.
      - Rörstrand Valentine: fat/kannor/koppar 8. Assietter = max 4.
      - Stig Lindberg icke-Domino: Reptil 8. Dyra studioföremål = max 4.
      - Harlequin (Marianne Westman): sockerkar/skålar 8. Enkla tallrikar = max 5.
      - Gustavshand-stämpel ("G" + hand + SWEDEN + krona) = GUSTAVSBERG, INTE Gabriel Keramik. Stig Lindberg icke-Domino: Randig, Spisa Ribb, Tahiti, Reptil, Studio = 8-9. Målad dekor (Berså, Prunus, Fallande löv, Comedia) = max 4. Kunden har 1 randig flaskform-vas + 2 signerade konstkakel ~15x15 (sedan 24 okt 2026) - ge 0-3 åt exakt samma.
      - Gabriel Keramik (svensk fabrik 1925-) = max 2. Kunden vill INTE ha Gabriel - det är annan fabrik än Gustavsberg trots viss formlikhet. Gabriel-stämpeln "GABRIEL" eller "Gabriel Keramik" är distinkt från Gustavshand.
      - Stig Lindberg Gustavsberg STUDIO/Drejargods (handsignerade unika pjäser med "Stig L" + årtal) = 9-10. Detta är kundens kärnjakt för icke-Domino. Signatur "Gustavsbergs Studio" + handsignatur.
      - Stig Lindberg stengods-serier (Randig, Terra, Pungo, Reptil, Veckla, Salix, Karneval): formbärande med reliefmönster/ränder = 8-9. Kunden samlar aktivt sedan 24 okt 2026.
      - Stig Lindberg fajans-serier Spisa Ribb/Tahiti/konstkakel: 8-9 om signerade Gustavshand. Berså/Prunus/Fallande löv/Comedia (målad dekor): max 4.
      - Spode Italian / Copeland Spode: fat, kannor, tekannor 8. Nästan alltid rätt.
      - Burkar MED LOCK gillas genomgående oavsett serie.
      - Krackelering, nagg och nyproduktion drar ner tydligt.
      - Ulrica Hydman-Vallien, Bertil Vallien, Ingeborg Lundin, Gunnel Sahlin, Kjell Engman och Bernadotte & Kylberg: nej.
      - Varm mässingston JA, silver/krom NEJ.
      - Stockholm är plus - kunden hämtar själv.
    bedomningsregler: |
      Kunden samlar skandinaviskt mid-century art glass + keramik 1949-1975.
      Namngivna serier och formgivare = krav för 8+. Var sparsam med 9 och 10:
      - 10: Röd Eld-pjäs i saknad form OCH långt under marknadspris. Ovanlig Höglund Boda-röd.
            Saknad Domino-form av Stig Lindberg i perfekt skick.
      - 9: Röd Eld standard-form i gott skick. Saknad Domino-form. Eftersökt Höglund-variant.
           Sommerso Nils Landberg karaff. Rörstrand Blå Eld ovanlig form (tekanna, kaffekanna).
      - 8: Blå Eld ovanlig form. Domino standard-form. Höglund opalin-vas. Harlequin sockerkar.
           Verifierad serie i gott skick.
      - 6–7: Rätt fabrik men vanlig form som kunden har. Lätt skick-problem. Osäker attribution.
      - 4–5: Osäker attribution. Nyproduktion av vanlig form. Utan stämpel.
      - 0–3: Fel kategori. Osignerad modern. Kunden har exakt den.
      Ett lågt pris är ett plus, inte ett tecken på låg kvalitet.
