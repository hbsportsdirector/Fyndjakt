spar:
  # ── 1. Inredningen ────────────────────────────────────────────
  hemmet:
    namn: The Reading Room
    profilfil: stil.md
    tillagg: |
      Jag letar begagnade/vintage-möbler och detaljer till det engelska biblioteket – inte golv, färg eller lister.
      Mest av allt: bokhyllor och biblioteksbokhyllor, vitrinskåp, Chesterfield (fåtölj eller soffa),
      skrivbord (mahogny, diplomatskrivbord), läsfåtölj/öronlappsfåtölj, Chippendale och engelsk stil,
      biblioteksstege, samt mässing: bankirlampa med grön skärm, lampetter, läslampor, ljusstakar,
      skrivställ, bokstöd och kuriosa (kompass, teleskop, sextant). Gamla läder- och klotband.
      Träslag: mahogny, valnöt, mörkbetsad ek, jakaranda/palisander. Ljus bok, björk, furu = lågt betyg.
      Mässing med patina, cognacfärgat läder och mörkgrön sammet är rätt.
      Letar INTE längre efter jordglobar, kartor, sjökort, konst (målningar, gravyrer, planscher) eller
      mattor – ge sådant högst 3.
      Fel: krom, blanka lackytor, kalla grå toner, ljus/vitpigmenterad ek, ljus skandinavisk minimalism.
      PLATS: Kunden bor i Stockholm och vill helst hämta själv. Föremål i Stockholmsområdet: +1 (högst 10).
      Stora eller ömtåliga föremål (möbler, stora fat, glas i set) långt från Stockholm utan frakt: −2.
      Små saker som enkelt skickas: ingen skillnad.
      MÖBLER ÄR HUVUDSAKEN. Ljusstakar, lampetter och andra småsaker i mässing är bara komplement:
      vanliga ljusstakar (enkla, nya, massproducerade, utan särskild form) högst 6. 8+ bara för något
      ovanligt – äldre med tydlig patina och fin form, ett riktigt par i engelsk/klassisk stil, eller en
      känd formgivare – till bra pris.
      Chippendale betyder möbler här – bestick, silver, film och musik med namnet är fel (0–2).
    uteslut_ord: [högglans, krom, vitpigmenterad, affisch, poster, furu, björk, bestick, dvd, cd-singel]
    # Synkade lärdomar 14 okt 2026: ny smak + det som stämmer från tidigare reaktioner.
    lardomar_bas: |
      - Mahogny, valnöt, mörkbetsad ek och jakaranda/palisander är rätt. Ljus bok, björk och furu är fel – även om formen är bra.
      - Engelsk biblioteksstil: Chesterfield, Chippendale, öronlappsfåtölj, diplomatskrivbord och biblioteksstege ger högt.
      - Mässing med patina och bruksslitage (ljusstakar, lampetter, skrivställ) gillas; blankt nytt mässing mindre.
      - Bankirlampa med grön skärm passar perfekt.
      - Gamla läderband gillas när de är enhetliga serier eller små klassiker till lågt pris (ca 100–400 kr). Dyra rese- och polarböcker avvisas trots fina band.
      - Mikroskop och andra stora instrument har fått nej; små mässingsobjekt (kompass, förstoringsglas) är bättre.
