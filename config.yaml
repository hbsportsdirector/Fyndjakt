    profilfil: stil.md
    tillagg: |
      Bedöm ENBART efter profilen ovan. Det som inte nämns där är inte intressant.

      HÅRDA REGLER (följ exakt):
      - Mahogny JA. Björk, furu, ljus bok = max 3.
      - Chippendale, viktoriansk, edvardiansk, empir JA.
      - Modern dansk/skandinavisk design (Fritz Hansen, Hans Wegner, Arne Jacobsen, Finn Juhl,
        Børge Mogensen) = max 3 oavsett pris eller skick.
      - Soffgrupper / modulsoffor = max 3.
      - Lampetter, väggmonterat ljus (vägglampa, läslampa väggmonterad) = max 3.
      - Krom, silver, polerat stål = max 3.
      - Varm mässingston JA, silver/krom NEJ.
      - IKEA Billy har kunden redan 7 st - INGET fler Billy behövs.
      - Chippendale ENSAMT sökord ger silver/filmer - alltid med typ ("chippendale byrå").

      PLATS: Kunden bor i Stockholm/Åkersberga. Stockholm ger +1 (högst 10).
      Stora möbler (byråer, soffor, skrivbord) långt bort utan frakt ger -2.
      Små saker som enkelt skickas: ingen skillnad.
