    har_redan_ord:
      - IKEA Billy
      - BILLY bokhylla
    # Omskrivna lärdomar 23 okt 2026 – ny smak.
    lardomar_bas: |
      - Mahogny JA, chippendale JA, viktoriansk JA, edvardiansk JA, empir JA - oftast rätt.
      - Byrå mahogny: historik 10 👍 / 2 👎 - oftast rätt.
      - Skrivbord mahogny engelsk stil med läderskiva: 1500-2500 kr sweet spot.
      - Sekretär rejäl med lådor/jalusi/dropfront: 1000-2000 kr sweet spot.
      - Mahogny bokskåp med glasdörrar / barristerstil JA.
      - Läderband böcker enhetliga serier låga priser JA (historik 8 👍 / 4 👎).
      - Mässingsljusstakar höga PAR eller kandelabrar JA. Nattljusstakar och enstaka omärkta: max 4.
      - Fåtölj läder modern designfåtölj NEJ (historik 1 👍 / 17 👎). Fritz Hansen, Wegner, Jacobsen inkluderat.
      - Lampetter, vägglampa, läslampa väggmonterad: NEJ (historik 9 👍 / 14 👎).
      - Picture-light mässing, bankerslamp, mässingsbordslampa, antik golvlampa: JA.
      - Antik jordglob, globen, antikvarikare (bookstand) på stativ: JA.
      - Antik klocka pendel / bordsklocka / resgolvur i mahogny: JA.
      - Persisk/orientalisk matta mörk: JA. Minst 160×240 cm.
      - Mörka tunga ridåer velur / bomullsvelour: JA.
      - Tartan/Pendleton pläd mörka toner: JA.
      - Chesterfield, wingback, klubbfåtölj finns redan - inga fler soffor behövs. Kompletterande engelska fåtöljer JA.
      - IKEA Billy har kunden 7 st - inget fler Billy behövs.
      - Varm mässingston JA, silver/krom NEJ.
      - Stockholm är plus - kunden hämtar själv.
    bedomningsregler: |
      Kunden inreder ett engelskt bibliotek (Sherlock Holmes-era, 1880-1920). Mahogny, läder,
      varm mässing, antikvarisk känsla. Var sparsam med 9 och 10:
      - 10: Antik engelsk mahogny-byrå original (1800-tal), partners desk med läderskiva perfekt skick,
            originalbankerslamp Emeralite/Faries, antik jordglob 1800-tal på trästativ.
      - 9: Chippendale-byrå, mahogny skrivbord med läderskiva, mahogny bokskåp med glasdörrar
           barristerstil, par av höga mässings-kandelabrar, antik pendelklocka mahogny.
      - 8: Mahogny-byrå standard, sekretär med lådor, läderband böcker-serie enhetlig, picture-light
           mässing, bordslampa mässing antik, persisk matta mörk 160×240.
      - 6–7: Rätt stil men mindre bra skick, enstaka Chippendale-stol, antik mahogny-småmöbel.
      - 4–5: Nära-rätt möbel men fel träslag (ek istället för mahogny), nyare kopia av antik design,
             modern mässingslampa i vintage-stil.
      - 0–3: Modern designfåtölj (Fritz Hansen etc.), lampett, Billy, skandinavisk minimalism,
             vit lack, krom, shabby chic.
