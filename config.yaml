  # ── 2. Konst, glas och design ────────────────────────────────
  samlingen:
    namn: Samlingen
    prioritet: 1          # söks först: föremål som båda spåren hittar hamnar här
    profilfil: samlingsprofil.md
    tillagg: |
      Hitta LIKNANDE fynd som passar samlingen – nya namn och föremål i samma anda,
      inte bara exakt samma konstnärer. Nordisk expressionism och abstraktion 1940–1990,
      signerad grafik och serigrafier, pop art, handblåst färgat svenskt designglas
      (starka färger: rött, koboltblått, smaragdgrönt, gult), signerad keramik från
      Gustavsberg/Rörstrand med grafiska mönster.
      Följ prisnivåerna i profilen: original 3 000–80 000 kr, grafik 500–8 000 kr,
      glas 200–2 000 kr, keramik 100–600 kr. Räkna ner för föremål långt över de nivåerna.
      Räkna ner för osignerat, omärkt, reproduktioner och tryck utan upplaga/signatur.
      Ge låga betyg åt dubbletter av sådant som redan finns i ägarförteckningen.
    uteslut_ord: [affischtryck, offsettryck, print on canvas]
    # Egna betygsregler för samlingen (ersätter den stränga standarden som gäller för hemmet).
    bedomningsregler: |
      Kunden SAMLAR svensk och nordisk designkeramik, porslin och glas från kända formgivare och
      fabriker (Rörstrand, Gustavsberg, Orrefors, Kosta Boda, Boda, Skultuna, Iittala m.fl.).
      Serietillverkade föremål ur namngivna serier är PRECIS vad hen söker – dra INTE ner för att
      något är serietillverkat, välkänt, vanligt på auktion eller ett bruksföremål.
      - 10: Eftersökt serie/formgivare i ovanlig färg, form eller variant, eller ett tydligt fynd långt under marknadspris.
      - 9: Känd formgivare eller eftertraktad serie (t.ex. Picknick, Swedish Grace, Blå Eld) i gott skick till bra pris.
      - 8: Namngiven formgivare eller fabrik med tydlig designhistoria som passar samlingen.
      - 6–7: Rätt fabrik men anonym eller ointressant form, eller dåligt skick.
      - 4–5: Osäker tillverkare, eller fel stil (t.ex. romantiskt, dekorporslin utan designhistoria).
      - 0–3: Fel kategori, reproduktion, eller exakt det kunden redan har.
      Ett lågt pris är ett plus, inte ett tecken på låg kvalitet.
      Samlingen omfattar också DESIGNADE BRUKSFÖREMÅL i metall och glas: Skultuna, Bernadotte & Kylberg
      (t.ex. Infinity), Pierre Forssell, Gense samt Orrefors-serier som Eternell (Owe Elvén). Sådana
      ska INTE dras ner för att de är mässing/metall eller "inte konst" – namngiven formgivare ger minst 8.
    max_pris: 40000
