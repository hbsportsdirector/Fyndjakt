    # Omskrivna lärdomar 23 okt 2026 – ny smak.
    lardomar_bas: |
      - Mahogny JA, chippendale JA, viktoriansk JA, edvardiansk JA, empir JA - oftast rätt.
      - Palisander/jakaranda mid-century bokhyllor (sektions, med glasdörrar/skåp): JA 8-9. Signerad designer (Sven Ellekaer, Albert Hansen, Ole Wanscher, Svante Skogh, Nils Jonsson Troeds) = 9. CITES-certifikat är kvalitetstecken.
      - Byrå mahogny: historik 10 👍 / 2 👎 - oftast rätt.
      - Skrivbord mahogny engelsk stil med läderskiva: 1500-2500 kr sweet spot.
      - Sekretär rejäl med lådor/jalusi/dropfront: 1000-2000 kr sweet spot.
      - Mahogny bokskåp med glasdörrar / barristerstil JA.
      - Läderband böcker enhetliga serier låga priser JA (historik 8 👍 / 4 👎).
      - Mässingsljusstakar höga PAR eller kandelabrar JA. Nattljusstakar och enstaka omärkta: max 4.
      - Fåtölj läder modern designfåtölj NEJ (historik 1 👍 / 17 👎). Fritz Hansen, Wegner, Jacobsen inkluderat.
      - Lampetter, vägglampa, läslampa väggmonterad: NEJ (historik 9 👍 / 14 👎).
      - Picture-light mässing, bankerslamp, mässingsbordslampa, antik golvlampa: JA.
      - Antik jordglob, globen, antikvarikare (bookstand) på stativ: JA.
      - Antik klocka pendel / bordsklocka / resgolvur i mahogny: JA.
      - Persisk/orientalisk matta mörk: JA. Minst 160×240 cm.
      - Mörka tunga ridåer velur / bomullsvelour: JA.
      - Tartan/Pendleton pläd mörka toner: JA.
      - 2 Chippendale library chairs finns redan. Kunden behöver EN loveseat (2-sits) till. Totalt 4 sittplatser räcker.
      - LOVESEAT-JAKT (uppdaterad 2026-11-05, pivot från 3-sits soffa): Howard & Sons Bridgewater-stil **2-sits (loveseat/settee)**
        i cognac/tan läder är TOPPRIO. Djup engelsk country house-settee med slät eller lätt randig rygg, lösa mjuka sittdynor (KRAV),
        gärna lösa ryggkuddar, scroll arms, kjol eller låga bun feet. Ska vara mjuk nog för filmtittande solo + partner.
      - 3-sits Howard-soffa är AVFÖRD som topprio – kunden behöver bara 4 platser och kompromissar hellre på storlek än pris.
        3-sits Howard ger OK betyg (7–8) om priset är lågt och den är i bra skick, men 2-sits är alltid första val.
      - Monks Chesterfield är AVFÖRD som jakt – för hård för filmtittande. Klassisk Chesterfield 2-sits cognac/oxblod = 7 (backup).
      - Loveseat-betyg: 10 = Howard & Sons Bridgewater 2-sits original eller George Smith Signature 2-sits, cognac/tan/kastanj,
        under 15 000 kr, Stockholm/pendlingsavstånd. 9 = Tetrad Prince/Monaco 2-sits, Duresta Lansdowne/Garrick/Waldorf 2-sits,
        Laura Ashley Mortimer/Kingston/Burlington, Multyork Berkeley – cognac/tan läder under 12 000 kr. 8 = vintage "Howard-stil"
        eller English country house settee 2-sits, slät rygg, lösa kuddar, cognac/tan läder, under 10 000 kr. 7 = klassisk
        Chesterfield 2-sits cognac/oxblod under 10 000 kr; eller 3-sits Howard-stil om extraordinärt pris. 5–6 = Howard-stil
        i fel färg, eller rätt stil men slitet läder. 0–3 = modern soffa, IKEA, modulsoffa, hörnsoffa, tygsoffa, reclinersoffa,
        chaise longue ensam, modern dansk/skandinavisk design.
      - Loveseatens färg: cognac/tan/kastanj = topp. Mörkbrun/mellanbrun = OK. Oxblod/burgundy = backup (rummet blir för rött).
        Honungsljus/ljusbrun/blond = NEJ. Svart/vit/grå = NEJ. Färgen syns på bilden – lita på bilden före texten.
      - Loveseatens form: slät eller lätt randig rygg = JA. Diamanttuftning över hela ryggen = Chesterfield (OK, inte toppval).
        Höga raka ben = NEJ (för modernt). Svenska "Howardmodell" (Englesson, Jio, Bröderna Andersson) är oftast TYG – då max 3.
      - Loveseatens mått: 2-sits 140–180 cm bred, djup 95–110 cm, höjd högst 95 cm (takhöjd 240 cm). Utanför måtten −2.
      - **Loveseatens prisnivå: max 15 000 kr absolut, sweet spot 5 000–10 000 kr.** Är den dyrare måste den vara extraordinär.
      - Vintage skinn-fotpall/ottoman i cognac/brun = 8 om under 2 000 kr (komplement till loveseaten för solo-film). Över 2 000 kr = 6.
      - Fler Chippendale cane back library chairs = max 4 (kunden har par sedan 26 okt 2026).
      - IKEA Billy har kunden 7 st - inget fler Billy behövs.
      - Varm mässingston JA, silver/krom NEJ.
