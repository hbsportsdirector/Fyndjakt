# ──────────────────────────────────────────────────────────────
#  Fyndjakt – inställningar
#  Ändra fritt. Allt som står här läses in vid varje körning.
#  Det finns två "spår": inredningen (The Reading Room) och konstsamlingen.
#  Varje spår har en egen profilfil, egna sökningar och en egen flik på hemsidan.
# ──────────────────────────────────────────────────────────────

# Gemensamt för båda spåren
bara_sverige: true                 # bara svenska auktionshus på Auctionet (Tradera är alltid svenskt)
min_betyg: 8                       # krävs för Telegram-notis och för att synas på sidan
sajt_min_betyg: 7                  # visas på sidan (reglaget börjar på min_betyg – dra ner till 7 för fler)
max_fran_kon_per_korning: 300      # väntande annonser som bildgranskas direkt ur kön varje natt
sajt_max_per_sokord: 0             # 0 = allt följer med i fynddatan; sidan varvar sökorden i stället för att dölja
sajt_visa_per_sokord: 5            # sidan visar högst så många per sökord (bäst först) – resten bakom "Visa alla" i filtret
max_pris: 25000                    # kr, 0 = ingen gräns (kan sättas per spår)
max_bedomningar_per_korning: 800   # fullgranskningar med bilder (ca 2,5 öre styck med batch)
sallning: true                     # sålla alla annonser på titel+pris först (ca 30 öre för 16 000)
sallning_min_betyg: 5              # under detta: sorteras bort utan bildgranskning
granska_max_per_sokord: 25         # bildgranska högst så många per sökord och natt (fler för sökord som ofta ger fynd)
gruppstorlek: 5                    # annonser per Claude-anrop – profilen skickas en gång per grupp
max_bedomningar_per_anvandare: 150  # för varje inbjuden användares egna spår
max_prisjamforelser_per_korning: 120  # sålda föremål på Auctionet hämtas för fynden som visas
# Tillfälligt (slutar gälla av sig självt efter "till", UTC): en natt med höjda gränser så att alla fynd
# jämförs om med storleksfiltret (2026-11-01). Kan tas bort när den gått ut.
# Snabbkörningen (varje timme hemma) tar bara flippspåret och sökord i de andra spåren som innehåller något av de
# här orden – sånt som försvinner på några timmar. Allt annat tas av kvällskörningen. Ändra listan fritt.
snabb_sokord:
  - Röd Eld
  - Blå Eld
  - Hertha Bengtson
  - Domino
  - Stig Lindberg
  - Höglund
  - Friberg
  - Simmulson
  - Atterberg
  - Ekeby

tillfalligt:
  till: "2026-11-02T12:00:00Z"
  max_prisjamforelser_per_korning: 1500
  granska_max_per_sokord: 60
  spar:
    flipp:
      max_bedomningar: 1500
sidor_per_sokning: 4               # hur många resultatsidor per sökning och sajt
modell: claude-haiku-4-5-20251001  # byt till claude-sonnet-5-5 för skarpare omdömen

# Nystart av smaken (UTC). Reaktioner, anteckningar och betyg från före tidpunkten styr inte längre
# bedömningen i spåret – bara profilen, lardomar_bas och det som händer efteråt. Aktiva fynd (8+)
# som bedömdes före tidpunkten betygsätts om en gång med den nya smaken.
smak_nystart:
  samlingen: "2026-10-25 08:00:00"
  hemmet: "2026-10-23 08:00:00"
max_omvarderingar_per_korning: 1500
# Betygsätt om aktiva fynd i ett spår efter skärpta regler (behåller det appen lärt sig).
# 2026-10-25: ny nystart på samlingen för att nollställa felaktiga Gabriel-lärdomar.
omvardera_fore:
  samlingen: "2026-10-25 08:00:00"

# Betygsregler för inbjudna användares egna spår (de skapar sina profiler på hemsidan).
bedomningsregler_anvandare: |
  Var kräsen men rättvis – kunden vill se ett urval, inte allt. Ungefär 1 av 6 annonser bör få 8 eller mer.
  - 10: Ett tydligt fynd: exakt det kunden beskriver, ovanligt eller långt under vad det brukar kosta.
  - 9: Exakt rätt sak, stil och kvalitet för kunden.
  - 8: Mycket bra match, väl värt att titta på.
  - 6–7: Rätt riktning men vardagligt, fel detalj eller osäkert skick.
  - 4–5: Kanske, men något skaver (fel färg, epok, material eller storlek).
  - 0–3: Fel sak, reproduktion, trasigt, eller sådant kunden redan har.
  Kända formgivare och eftersökta serier ska inte dras ner för att de är serietillverkade.
  Men vanliga saker som det alltid finns gott om till salu (mattor, ljusstakar, landskapsmålningar,
  litografier, tallrikar) får 8 eller mer BARA om just den här sticker ut: ovanligt fin, ovanligt billig
  eller ovanlig i sig. En som bara är "rätt sort" är 6–7. Kunden behöver inte 40 av samma sak.

uteslut_ord:
  - ikea
  - plast
  - reservdel
  - defekt
  - reproduktion

