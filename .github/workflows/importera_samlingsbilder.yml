name: Importera samlingsbilder

# Engångskörning: laddar upp samlingens bilder (tools/samling-migrering) till Supabase-bucketen `samling`
# och fyller i samling_foremal.bilder. Går att köra om.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/samling-migrering/**"
      - "tools/importera_samlingsbilder.py"
      - ".github/workflows/importera_samlingsbilder.yml"

permissions:
  contents: read

jobs:
  importera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/importera_samlingsbilder.py
