name: Importera samlingsbilder

# Engångskörning: laddar upp samlingens bilder (tools/samling-migrering) till Supabase-bucketen `samling`
# och fyller i samling_foremal.bilder. Går att köra om.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/samling-migrering/**"
      - "tools/importera_samlingsbilder.py"
      - ".github/workflows/importera_samlingsbilder.yml"

permissions:
  contents: read

jobs:
  importera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-pages   # nycklarna kan ligga på miljön i stället för på repot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Finns nycklarna? (bara ja/nej)
        run: |
          echo "SUPABASE_URL satt: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_ROLE_KEY satt: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "SUPABASE_SERVICE_KEY satt: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}"
          echo "SUPABASE_KEY satt: ${{ secrets.SUPABASE_KEY != '' }}"
          echo "FYNDJAKT_BOT_TOKEN satt: ${{ secrets.FYNDJAKT_BOT_TOKEN != '' }}"
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/importera_samlingsbilder.py
