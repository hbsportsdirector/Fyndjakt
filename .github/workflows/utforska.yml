name: Utforska källor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py
      - run: |
          git config user.name "fyndjakt-bot"
          git config user.email "fyndjakt-bot@users.noreply.github.com"
          git pull -q --rebase origin main
          git add data/probe
          git diff --cached --quiet || git commit -m "Provhämtning av källor"
          git push
