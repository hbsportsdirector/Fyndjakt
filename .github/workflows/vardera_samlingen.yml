name: Värdera samlingen

# Omvärderar samlingen mot sålda föremål på Auctionet och sparar värde + prishistorik i Supabase.
# En gång i månaden (den 2:a), när koden ändras, och för hand.
on:
  schedule:
    - cron: "23 3 2 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vardering.py"
      - "tools/vardera_samlingen.py"
      - ".github/workflows/vardera_samlingen.yml"

permissions:
  contents: read

concurrency:
  group: vardera-samlingen
  cancel-in-progress: false

jobs:
  vardera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          FYNDJAKT_BOT_TOKEN: ${{ secrets.FYNDJAKT_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/vardera_samlingen.py
