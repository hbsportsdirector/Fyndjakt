name: Miniatyrer (backfill)

# Engångskörning: miniatyrer för fynd som redan finns i databasen. Nattkörningen sköter resten.
on:
  workflow_dispatch:
  push:
    paths: ["tools/backfill_bilder.py", ".github/workflows/backfill_bilder.yml"]

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          FYNDJAKT_BOT_TOKEN: ${{ secrets.FYNDJAKT_BOT_TOKEN }}
        run: python tools/backfill_bilder.py
