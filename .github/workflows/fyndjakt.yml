name: Fyndjakt

on:
  schedule:
    # GitHub kan försena schemalagda körningar flera timmar – därför tidig start plus en reserv.
    - cron: "17 3 * * *"   # 05:17 svensk sommartid (04:17 vintertid)
    - cron: "17 5 * * *"   # reserv 07:17 – körs bara om dagens körning inte redan är gjord
  workflow_dispatch:        # gör att du kan köra den manuellt från fliken Actions
  push:                     # kör direkt när du ändrar stilen, inställningarna eller koden
    branches: [main]
    paths:
      - "stil.md"
      - "config.yaml"
      - "**.py"
      - ".github/workflows/**"
      - "!.github/workflows/publicera.yml"
      - "!.github/workflows/testnotis.yml"
      - "!.github/workflows/utforska.yml"

permissions:
  contents: write           # för att spara listan över sedda annonser
  pages: write              # för att publicera hemsidan
  id-token: write

concurrency:
  group: fyndjakt
  cancel-in-progress: false

jobs:
  # Reservkörningen hoppar över allt om dagens körning redan är gjord.
  koll:
    runs-on: ubuntu-latest
    outputs:
      klar: ${{ steps.koll.outputs.klar }}
    steps:
      - uses: actions/checkout@v4
      - id: koll
        run: |
          IDAG=$(date -u +%F)
          SENAST=$(python3 -c "import json;print(json.load(open('data/senaste_korning.json')).get('tid','')[:10])" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 5 * * *" ] && [ "$SENAST" = "$IDAG" ]; then
            echo "Dagens körning är redan gjord ($SENAST) – hoppar över."
            echo "klar=1" >> "$GITHUB_OUTPUT"
          fi

  jakt:
    needs: koll
    if: needs.koll.outputs.klar != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.publicera.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leta fynd och bygg hemsidan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          FYNDJAKT_BOT_TOKEN: ${{ secrets.FYNDJAKT_BOT_TOKEN }}
          SAJT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python main.py

      - name: Spara sedda annonser
        if: always()
        continue-on-error: true   # hemsidan ska publiceras även om sparandet krånglar
        run: |
          git config user.name "fyndjakt-bot"
          git config user.email "fyndjakt-bot@users.noreply.github.com"
          git add data/sedda.db data/senaste_korning.json
          git add data/smakanalys.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera sedda annonser"
          # Om något annat laddats upp under körningen: lägg resultaten ovanpå och försök igen.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git checkout --theirs data/ ; git add data/ ; GIT_EDITOR=true git rebase --continue ; }
            sleep 5
          done
          exit 1

      # Sidan byggs om med den SENASTE koden – annars kan en lång körning publicera en äldre version
      # av sidan ovanpå ändringar som gjorts medan den pågick.
      - name: Bygg om sidan med senaste koden
        if: always()
        env:
          FYNDJAKT_BOT_TOKEN: ${{ secrets.FYNDJAKT_BOT_TOKEN }}
        run: |
          git fetch -q origin main && git checkout -q origin/main -- . ':!data' || true
          python publicera.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicera hemsidan
        id: publicera
        uses: actions/deploy-pages@v4
